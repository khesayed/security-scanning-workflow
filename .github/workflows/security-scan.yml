name: Security Scan

on:
  pull_request:
  push:
    branches: [ main ]
  
jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
    
      # -----------------------
      # Node.js setup
      # -----------------------
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # -----------------------
      # Install project dependencies - required by Syft/Grype and JS scanners
      # -----------------------
      - name: Install dependencies
        run: npm install

      # -----------------------
      # SBOM + Vulnerability
      # -----------------------

      # -----------------------
      # Syft
      # Generates SBOM - (Software Bill of Materials) - list of components and dependencies in a project from package.json, Docker image, filesystem
      # -----------------------
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft package-lock.json -o cyclonedx-json=sbom_raw.json

      # -----------------------
      # Grype
      # Vulnerability scanner using SBOM as input
      # -----------------------
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype vulnerability scan (fail on HIGH+)
        run: grype sbom:sbom.json --fail-on high -o json > grype-report.json

      # -----------------------
      # Trivy FS and Docer image scans
      # Full security scan including filesystems, docker, OS packages, etc.
      # -----------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # -----------------------
      # Run Trivy vulnerability scan (fail on HIGH+)
      # -----------------------
      - name: Run Trivy vulnerability scan (fail on HIGH+)
        run: trivy fs . --exit-code 1 --severity HIGH,CRITICAL --scanners vuln --format json --output trivy-fs-report.json
      
      # -----------------------
      # Build Docker image
      # -----------------------
      # - name: Build Docker image
      #   run: docker build -t my-app:latest .
      
      # -----------------------
      # Trivy scan Docker image
      # -----------------------
      # - name: Scan Docker image with Trivy
      #   run: trivy image --exit-code 1 --severity HIGH,CRITICAL --format json --output trivy-image-report.json my-app:latest


      # -----------------------
      # JS-specific scanners
      # -----------------------

      # -----------------------
      # Retire.js
      # Checks for known vulnerabilities in JS libraries and Old/Deprecated libraries
      # -----------------------
      - name: Install Retire.js
        run: npm install -g retire

      - name: Run Retire.js scan (fail on HIGH+)
        run: retire --path . --outputformat json --outputpath retire-report.json --severity high --exitwith 1

      # -----------------------
      # AuditJS
      # Sonatype-nexus-community
      # Checks Javascript/Node project using Sonatype OSS Index (Free and opensource huge databases for CVEs)
      # -----------------------
      - name: Install AuditJS
        run: npm install -g auditjs

      - name: Run AuditJS scan (fail on HIGH+)
        run: auditjs ossi --exit-code high --format json > auditjs-report.json


      # -----------------------
      # 11) Upload artifacts
      # -----------------------
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype-report.json

      - name: Upload Retire.js report
        uses: actions/upload-artifact@v4
        with:
          name: retirejs-report
          path: retire-report.json
      
      - name: Upload AuditJS report
        uses: actions/upload-artifact@v4
        with:
          name: auditjs-report
          path: auditjs-report.json


      - name: Upload Trivy filesystem report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json

      # - name: Upload Trivy Docker image report
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: trivy-image-report
      #     path: trivy-image-report.json